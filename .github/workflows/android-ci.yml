name: Modern UI Android CI

on:
  push:
    branches:
      - modern-ui
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - modern-ui
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build development APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Restore stable development signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MODERN_UI_DEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MODERN_UI_DEV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MODERN_UI_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MODERN_UI_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/modern-ui-dev.jks
          chmod 600 android/modern-ui-dev.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../modern-ui-dev.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run existing automated tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter test files found."
          fi

      - name: Analyze new UI code
        shell: bash
        run: |
          targets=()
          if [ -d lib/new_ui ]; then
            targets+=("lib/new_ui")
          fi
          if [ -d test/new_ui ]; then
            targets+=("test/new_ui")
          fi

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No new UI sources yet; targeted analysis is not applicable in Task 0."
          else
            flutter analyze "${targets[@]}"
          fi

      - name: Build beta debug APK
        run: flutter build apk --debug --flavor beta

      - name: Verify APK install identity
        shell: bash
        env:
          EXPECTED_PACKAGE_ID: top.apaipai.dsm_helper
          EXPECTED_CERT_SHA256: 0B:8E:6E:07:65:CF:BA:89:E1:56:F3:03:7B:66:C9:E9:38:2D:91:F7:88:E5:E9:BE:50:51:6D:F0:23:13:D9:A2
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-beta-debug.apk
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"
          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"

          EXPECTED_CERT_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          CERT_NORMALIZED="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "Package ID: $PACKAGE_ID"
          echo "Signing certificate SHA-256: $CERT_SHA256"

          test "$PACKAGE_ID" = "$EXPECTED_PACKAGE_ID"
          test "$CERT_NORMALIZED" = "$EXPECTED_CERT_NORMALIZED"

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: dsm-helper-modern-ui-android-debug
          path: build/app/outputs/flutter-apk/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 14
