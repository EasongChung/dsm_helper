name: Modern UI Android CI

on:
  push:
    branches:
      - modern-ui
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - modern-ui
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # Fork-safe signing: the upstream workflow restored a keystore from repo
      # secrets (MODERN_UI_DEV_*). Secrets are NOT inherited by forks, so we
      # mint a throwaway keypair at build time instead. Swap this for a
      # secrets-backed key before publishing to a store.
      - name: Generate ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore android/ci-release.jks \
            -storetype JKS \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=CN"
          {
            printf 'storePassword=ci-release-pass\n'
            printf 'keyPassword=ci-release-pass\n'
            printf 'keyAlias=ci-release\n'
            printf 'storeFile=../ci-release.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties
          cat android/key.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run existing automated tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter test files found."
          fi

      - name: Analyze new UI code
        shell: bash
        run: |
          targets=()
          if [ -d lib/new_ui ]; then
            targets+=("lib/new_ui")
          fi
          if [ -d test/new_ui ]; then
            targets+=("test/new_ui")
          fi

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No new UI sources yet; targeted analysis is not applicable."
          else
            flutter analyze "${targets[@]}"
          fi

      - name: Build beta release APK
        run: flutter build apk --release --flavor beta

      - name: Build production release APK
        continue-on-error: true
        run: flutter build apk --release --flavor production

      - name: Verify APK install identity
        shell: bash
        env:
          EXPECTED_PACKAGE_ID: top.apaipai.dsm_helper
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-beta-release.apk
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"

          echo "Package ID: $PACKAGE_ID"
          test "$PACKAGE_ID" = "$EXPECTED_PACKAGE_ID"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dsm-helper-modern-ui-android-apk
          path: |
            build/app/outputs/flutter-apk/app-beta-release.apk
            build/app/outputs/flutter-apk/app-production-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Scan APK for advertising SDKs
        shell: bash
        run: |
          set -uo pipefail
          SCAN_STATUS=0
          for APK in build/app/outputs/flutter-apk/app-beta-release.apk \
                     build/app/outputs/flutter-apk/app-production-release.apk; do
            [ -f "$APK" ] || continue
            echo "::group::Scanning $APK"
            python3 tool/apk_ad_scan.py "$APK" | tee "scan-$(basename "$APK").txt"
            STATUS="${PIPESTATUS[0]}"
            [ "$STATUS" -eq 0 ] || SCAN_STATUS=1
            echo "::endgroup::"
          done
          if [ "$SCAN_STATUS" -ne 0 ]; then
            echo "::error::Advertising SDK detected - build failed"
            exit 1
          fi
          echo "::notice::All APKs are free of advertising SDKs."

      - name: Upload ad-scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-ad-scan-reports
          path: scan-*.txt
          if-no-files-found: ignore
          retention-days: 14
