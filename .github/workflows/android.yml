name: Build DSM Helper APK (master-noads)

on:
  push:
    branches:
      - master-noads
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter 3.7.12
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      # key.properties 未入库（.gitignore），keystore 密码未知。
      # 生成一套临时签名密钥用于 Release 构建；正式发布请替换为自有 keystore。
      - name: Generate ephemeral signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore android/ci-release.jks \
            -storetype JKS \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=CN"
          {
            printf 'storePassword=ci-release-pass\n'
            printf 'keyPassword=ci-release-pass\n'
            printf 'keyAlias=ci-release\n'
            printf 'storeFile=../ci-release.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties
          cat android/key.properties

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify package id
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "Package ID: $PACKAGE_ID"
          test "$PACKAGE_ID" = "fit.flutter.dsm_helper"

      - name: Upload APK artifact (always, even if scan fails)
        uses: actions/upload-artifact@v4
        with:
          name: dsm-helper-master-noads-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Scan APK for advertising SDKs
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "::group::Scanning $APK for ad SDKs"
          # 只匹配真正的广告 SDK 符号，不匹配裸词（如注释中的 "pangle"）
          HARD_PATTERNS="com/bytedance|com/bytedance/sdk|PangleAd|PangleNativeAd|PangleBannerAd|PangleSplashAd|TTAdSdk|com/qq/e/ads|com/kwad/sdk|com/baidu/mobads|com/google/android/gms/ads|com/applovin|com/unity3d/ads|com/inmobi|com/mopub|com/sigmob|com/tradplus|com/anythink"
          HITS=0
          for pat in $HARD_PATTERNS; do
            C=$(unzip -p "$APK" 'classes*.dex' 2>/dev/null | grep -a -i -c "$pat" || true)
            if [ "$C" -gt 0 ]; then
              echo "HIT: $pat x$C"
              HITS=$((HITS + C))
            fi
          done
          # 也检查原生库文件名
          for pat in libpangle|pangolin|ttadsdk|libkwad|unityads|libapplovin|mediationsdk|libtopon|libgdt; do
            C=$(unzip -l "$APK" 2>/dev/null | grep -a -i -c "$pat" || true)
            if [ "$C" -gt 0 ]; then
              echo "HIT (native lib): $pat x$C"
              HITS=$((HITS + C))
            fi
          done
          if [ "$HITS" -gt 0 ]; then
            echo "::error::Advertising SDK signature detected in APK"
            exit 1
          fi
          echo "OK: no advertising SDK signature detected"
          echo "::endgroup::"
