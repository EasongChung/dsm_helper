name: DSM_helper_Android_DEV

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_android:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Java to compile Android project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and set Flutter version
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      # Fork-safe: generate a throwaway keystore instead of restoring one from
      # the (fork-inaccessible) KEY_PROPERTIES secret.
      - name: Create the Keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore android/ci-release.jks \
            -storetype JKS \
            -storepass ci-release-pass \
            -keypass ci-release-pass \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI,OU=CI,O=CI,L=CI,ST=CI,C=CN"
          {
            printf 'storePassword=ci-release-pass\n'
            printf 'keyPassword=ci-release-pass\n'
            printf 'keyAlias=ci-release\n'
            printf 'storeFile=../ci-release.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Restore packages
        run: flutter pub get

      - name: Build Android Apk
        run: flutter build apk --release --flavor=beta

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-beta-release.apk
          tag: ${{ github.ref }}
          release_name: ${{ github.ref }}
          overwrite: true
          body: ""
